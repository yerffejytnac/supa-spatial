name: Build and Publish PostgreSQL 18 Multi-Arch Image

on:
  push:
    branches: [feat/postgresql-18]
  workflow_dispatch:

env:
  IMAGE_NAME: yerffejytnac/supa-spatial

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-18
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:18-amd64
          cache-from: type=gha,scope=amd64-pg18
          cache-to: type=gha,mode=max,scope=amd64-pg18

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-18
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:18-arm64
          cache-from: type=gha,scope=arm64-pg18
          cache-to: type=gha,mode=max,scope=arm64-pg18

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:18 \
            ${{ env.IMAGE_NAME }}:18-amd64 \
            ${{ env.IMAGE_NAME }}:18-arm64

          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:18-latest \
            ${{ env.IMAGE_NAME }}:18-amd64 \
            ${{ env.IMAGE_NAME }}:18-arm64

          echo "### Multi-arch manifest created! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_NAME }}:18\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_NAME }}:18-latest\`" >> $GITHUB_STEP_SUMMARY
